server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Hashed build assets: cache for a year
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # Never cache the entry point or the MSW service worker
    location = /index.html {
        expires -1;
    }

    location = /mockServiceWorker.js {
        expires -1;
    }

    # SPA fallback so client-side routes survive a refresh
    location / {
        try_files $uri $uri/ /index.html;
    }
}
